[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.26"  # the scratch run pointed at a local solc 0.8.26 binary; needs lib/forge-std and lib/solady
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
offline = true
remappings = ["forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]
[fuzz]
runs = 20000
