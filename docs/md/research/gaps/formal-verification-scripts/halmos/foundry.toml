[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "../foundry-bin/solc-0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
offline = true
extra_output = ["storageLayout", "metadata"]
ast = true
remappings = ["v4-core/=lib/v4-core/src/", "forge-std/=lib/forge-std/src/", "solady/=lib/solady/src/"]
[fuzz]
runs = 20000
